    - data:
        code: |
          import json

          def main(detection_result: str) -> dict:
              result = json.loads(detection_result)

              def number(name: str, default: float = 0.0):
                  value = result.get(name)
                  return default if value is None else value

              return {
                  "success": result.get("success", False),
                  "result": result.get("result", ""),
                  "run_date": result.get("run_date", ""),
                  "pipe_name": result.get("pipe_name", ""),
                  "location_type": result.get("location_type", "pipe"),
                  "if_anomaly": result.get("if_anomaly", False),
                  "route": result.get("route", "DATA_ISSUE"),
                  "anomaly_flag": number("anomaly_flag", -1),
                  "flag_name": result.get("flag_name", ""),
                  "quantile_10": number("quantile_10"),
                  "quantile_25": number("quantile_25"),
                  "quantile_75": number("quantile_75"),
                  "quantile_90": number("quantile_90"),
                  "anomaly_ratio": number("anomaly_ratio"),
                  "ratio_low": number("ratio_low"),
                  "ratio_high": number("ratio_high"),
                  "direction": result.get("direction", "UNKNOWN"),
                  "duration_anomaly_flag": number("duration_anomaly_flag", -1),
                  "duration_quantile_10": number("duration_quantile_10"),
                  "duration_quantile_25": number("duration_quantile_25"),
                  "duration_quantile_75": number("duration_quantile_75"),
                  "duration_quantile_90": number("duration_quantile_90"),
                  "duration_anomaly_ratio": number("duration_anomaly_ratio"),
                  "duration_ratio_low": number("duration_ratio_low"),
                  "duration_ratio_high": number("duration_ratio_high"),
                  "duration_direction": result.get("duration_direction", "UNKNOWN"),
                  "duration_status": result.get("duration_status", "NO_DATA"),
                  "regime": result.get("regime", "UNKNOWN"),
              }
