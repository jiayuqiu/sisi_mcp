name: sisi-backend

services:
  mcp_server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: sisimcp-mcp-server
    ports:
      - "8000:8000"
    environment:
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
      - MCP_TRANSPORT=streamable-http
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - SISI_API_KEY=${SISI_API_KEY}
      - BCI_APP_ID=${BCI_APP_ID}
      - BCI_SECRET_KEY=${BCI_SECRET_KEY}
      - BCI_BASE_URL=${BCI_BASE_URL}
    volumes:
      - ../data:/app/data
      - ../tmp:/app/tmp
    command: uv run python mcp_server_http.py
    restart: unless-stopped
    networks:
      - default
      - dify_platform

  dify_api_server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: sisimcp-dify-api
    ports:
      - "8002:8002"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - SISI_API_KEY=${SISI_API_KEY}
      - BCI_APP_ID=${BCI_APP_ID}
      - BCI_SECRET_KEY=${BCI_SECRET_KEY}
      - BCI_BASE_URL=${BCI_BASE_URL}
    volumes:
      - ../data:/app/data
      - ../tmp:/app/tmp
    command: uv run python dify_api_server.py
    restart: unless-stopped
    depends_on:
      - mcp_server
    networks:
      - default
      - dify_platform

  bci_sync:
    build:
      context: ..
      dockerfile: docker/Dockerfile.sync
    container_name: sisimcp-bci-sync
    environment:
      - BCI_APP_ID=${BCI_APP_ID}
      - BCI_SECRET_KEY=${BCI_SECRET_KEY}
      - BCI_BASE_URL=${BCI_BASE_URL}
      - BCI_SYNC_START_DATE=${BCI_SYNC_START_DATE:-2026-01-01}
    volumes:
      - ../data:/app/data
    restart: unless-stopped
    networks:
      - default

  frontend_nextjs:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: sisimcp-frontend-nextjs
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DIFY_API_KEY=${DIFY_API_KEY}
      - DIFY_CHATFLOW_URL=${DIFY_CHATFLOW_URL}
      - SQLITE_DB_PATH=/app/data/sisi.sqlite
    volumes:
      - ../data:/app/data
    restart: unless-stopped
    depends_on:
      - dify_api_server
    networks:
      - default
      - dify_platform
networks:
  default: {}
  dify_platform:
    external: true
    name: sisi-dify-platform_default
