name: sisi-backend

services:
  mcp_server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: sisimcp-mcp-server
    ports:
      - "8010:8000"
    environment:
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
      - MCP_TRANSPORT=streamable-http
    volumes:
      - ../data:/app/data
      - ../tmp:/app/tmp
    command: uv run python mcp_conductor/servers/mcp_server_http.py
    restart: unless-stopped
    networks:
      - default
      - dify_platform

  dify_api_server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: sisimcp-dify-api
    ports:
      - "8002:8002"
    env_file: ../.env
    volumes:
      - ../data:/app/data
      - ../tmp:/app/tmp
    command: uv run python mcp_conductor/servers/dify_api_server.py
    restart: unless-stopped
    depends_on:
      - mcp_server
    networks:
      - default
      - dify_platform

  bci_sync:
    build:
      context: ..
      dockerfile: docker/Dockerfile.sync
    container_name: sisimcp-bci-sync
    env_file: ../.env
    environment:
      - BCI_SYNC_START_DATE=${BCI_SYNC_START_DATE:-2026-01-01}
      - TZ=Australia/Sydney
    volumes:
      - ../data:/app/data
      - ../tmp:/var/log
    restart: unless-stopped
    networks:
      - default

  frontend_nextjs:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: sisimcp-frontend-nextjs
    ports:
      - "3001:3000"
    env_file: ../.env
    environment:
      - NODE_ENV=production
      - SQLITE_DB_PATH=/app/data/sisi.sqlite
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../data:/app/data
    restart: unless-stopped
    depends_on:
      - dify_api_server
    networks:
      - default
      - dify_platform
networks:
  default: {}
  dify_platform:
    external: true
    name: sisi-dify-platform_default
